# A comparison of screens of two builds (FTR.NAB.CMN-0005 qa §6): "before" is the given
# commit, "after" is the branch of the run. Both builds get the same data from
# e2e/mock.mjs and are captured by one suite on one machine; the tolerance is zero pixels.
# Run by hand: when moving to the kit and before updating its major version. When moving,
# differences are expected (design §7): run with report_only, and the product owner accepts the report.
name: visual
on:
  workflow_dispatch:
    inputs:
      base: { description: "Commit or tag of \"before\"", required: true, type: string }
      report_only: { description: "Only a report: differences are expected, and a person accepts them", required: false, default: false, type: boolean }
permissions: { contents: read }

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm }
      - name: Build "after"
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build "before"
        env:
          BASE: ${{ inputs.base }}
        run: |
          git worktree add --detach ../before "$BASE"
          cd ../before && npm ci --no-audit --no-fund && npm run build
      - run: npx playwright install --with-deps chromium
      # one suite captures both builds: it finds elements by what the user sees
      - name: Screenshots "before"
        run: DIST=../before/dist SHOTS_DIR=shots/before npx playwright test
      - name: Screenshots "after"
        run: DIST=dist SHOTS_DIR=shots/after npx playwright test
      - name: Compare
        env:
          REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          args=(shots/before shots/after shots/report)
          [[ $REPORT_ONLY == true ]] && args+=(--report-only)
          node e2e/compare.mjs "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: screens, path: shots/report, if-no-files-found: ignore }
