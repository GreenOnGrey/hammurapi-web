<!doctype html>
<!-- The viewer of an OpenAPI contract (FTR.HMR.SPEC-0004 R7, arch §3.3): Swagger UI in a frame sandboxed
     without allow-same-origin. The parent fetches the contract and posts its text; the frame sends nothing
     to the network and has no "Try it out". Classic scripts: an opaque origin loads them without CORS. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>OpenAPI</title>
  <link rel="stylesheet" href="swagger-ui.css">
  <link rel="stylesheet" href="openapi.css">
</head>
<body>
  <div id="ui"></div>
  <script src="swagger-ui-bundle.js"></script>
  <script src="openapi.js"></script>
</body>
</html>
